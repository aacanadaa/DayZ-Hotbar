plugins {
    // Pinned rather than '6.0.+' - a wildcard re-resolves to a new build without
    // anyone asking, and a ForgeGradle that has moved on is a build that stops
    // reproducing.
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'me.modmuss50.mod-publish-plugin'
}

// NOTE: this module deliberately does not use the MixinGradle plugin and ships no
// mixin config. Forge's HUD runs through its own layered renderer, so the shared
// GuiMixin cannot replace the status readout here - see ForgeHudHandler and
// CLAUDE.md. The HUD is driven through AddGuiOverlayLayersEvent instead, which
// needs no mixin, no refmap and no SRG remapping, and so cannot regress into the
// class of failure the mixin had.

// Both the Minecraft version and the loader belong in the release name. CurseForge
// rejects a second file whose display name matches an existing one in the same
// project, and this mod ships the same version for Fabric, Forge and NeoForge - so
// the loader is the part that keeps them apart on the file list.
def releaseName = "DayZ Hotbar ${project.version} for Minecraft ${project.minecraft_version} (Forge)"

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                dayz_hotbar {
                    // Only this project's output is on the mod path. The common
                    // module's sources are compiled into sourceSets.main below, so
                    // adding it again would put a second copy of the HUD on the
                    // classpath.
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                dayz_hotbar {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // NOTE: deliberately no `implementation project(':common')`. sourceSets.main
    // below compiles the common module's sources directly, so both loaders share one
    // copy of the HUD implementation; a project dependency would only add a second
    // copy of those classes to the classpath.
}

sourceSets {
    main {
        java {
            srcDirs += project(':common').sourceSets.main.java.srcDirs
            // The shared GuiMixin is Fabric's mechanism and is not used here - Forge
            // reaches the HUD through AddGuiOverlayLayersEvent instead (see
            // ForgeHudHandler). Excluding it from the source set keeps it out of the
            // compile as well as the jar, so this module needs no Mixin dependency at
            // all.
            exclude 'com/suoim/dayzhotbar/client/mixin/**'
        }
        resources {
            srcDirs += project(':common').sourceSets.main.resources.srcDirs
            exclude 'dayz-hotbar.client.mixins.json'
        }
    }
}

// The common module's classes and resources are compiled into this project's own
// output via sourceSets.main above, so the jar needs no extra `from` for them.
// Anything pulled in from common's build directory would only add duplicate
// classes plus Loom's intermediary refmap, which Forge cannot use.
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            'Specification-Title'     : 'dayz_hotbar',
            'Specification-Vendor'    : 'suoim',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'suoim'
        ])
    }
}

tasks.named('processResources', ProcessResources) {
    // Keep the declared mod version in step with gradle.properties rather than
    // letting a literal drift away from the version being built.
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

base {
    archivesName = "dayz-hotbar-forge-${project.minecraft_version}"
}

// --- No reobfuscation on this Minecraft version ---------------------------
// Up to and including 1.20.1 this module shipped a reobfuscated jar: Forge
// resolved members against SRG at runtime while the `jar` task packaged official
// (Mojang) names, so the jar could not load until ForgeGradle rewrote it, and an
// elaborate dance existed to make sure the *reobfuscated* file was the one that
// reached build/libs and the stores. That dance went wrong once, and a broken
// Forge release shipped while the GitHub release was fine.
//
// Forge 1.21.1 does not work that way. It resolves against official names at
// runtime, exactly like NeoForge, so there is no reobf jar task to depend on and
// nothing to rewrite - verified by scanning all 1201 classes in
// forge-1.21.1-52.1.16-universal.jar, which contain no SRG method references.
//
// So the plain `jar` output is the shippable artifact again, and `publishMods`
// reads `jar.archiveFile` directly. The failure mode the old dance guarded against
// cannot recur, because there is no longer a second, un-reobfuscated copy of the
// jar for a release to pick up by mistake. Do not reintroduce a reobf step here
// without checking that it is needed - a `reobfJar` task does not exist on this
// line, and ForgeGradle will fail the build if you name it.
publishMods {
    file = tasks.named('jar').flatMap { it.archiveFile }
    changelog = rootProject.file("CHANGELOG.md").text
    type = STABLE

    modrinth {
        displayName = releaseName
        projectId = project.modrinth_id
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        modLoaders.add("forge")
        // Deliberately no requires("fabric-api") and none for Forge either: the
        // HUD hooks Forge's own layered HUD renderer and needs no loader API.
    }

    curseforge {
        displayName = releaseName
        projectId = project.curseforge_id
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        modLoaders.add("forge")
        // Client-only: there is no server-side component, and marking it
        // server-compatible would invite people to install it on a server that can
        // do nothing with it.
        client = true
        server = false
    }
}
