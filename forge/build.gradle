plugins {
    id 'net.minecraftforge.gradle' version '6.0.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'me.modmuss50.mod-publish-plugin'
}

// Both the Minecraft version and the loader belong in the release name. CurseForge
// rejects a second file whose display name matches an existing one in the same
// project, and this mod ships the same version for Fabric and Forge - so the
// loader is the part that keeps the two apart on the file list.
def releaseName = "DayZ Hotbar ${project.version} for Minecraft ${project.minecraft_version} (Forge)"

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                dayz_hotbar {
                    // Only this project's output is on the mod path. The common
                    // module's sources are compiled into sourceSets.main below, so
                    // adding it again would put a second copy of the mixin config
                    // and Loom's intermediary refmap on the classpath, and Mixin
                    // would resolve the wrong one.
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                dayz_hotbar {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // NOTE: deliberately no `implementation project(':common')`. sourceSets.main
    // below compiles the common module's sources directly, so a project dependency
    // would only add a second copy of those classes - and Loom's intermediary
    // refmap - to the classpath, which breaks Mixin.
}

sourceSets {
    main {
        java {
            srcDirs += project(':common').sourceSets.main.java.srcDirs
        }
        resources {
            srcDirs += project(':common').sourceSets.main.resources.srcDirs
        }
    }
}

mixin {
    add sourceSets.main, "dayz-hotbar.refmap.json"
    config "dayz-hotbar.client.mixins.json"
}

// The common module's classes and resources are compiled into this project's own
// output via sourceSets.main above, so the jar needs no extra `from` for them.
// Anything pulled in from common's build directory would only add duplicate
// classes plus Loom's intermediary refmap, which Forge cannot use.
jar {
    // This is a DEVELOPMENT jar. ForgeGradle has not reobfuscated it yet, so it
    // still carries official (Mojang) member names, and Forge resolves members
    // against SRG at runtime - loading a class from it dies the moment a mod class
    // initialises. Keep it out of build/libs, which exists only to hold the
    // shippable artifact; see "Ship the REOBFUSCATED jar" below.
    destinationDirectory = layout.buildDirectory.dir('devlibs')

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            'Specification-Title'     : 'dayz_hotbar',
            'Specification-Vendor'    : 'suoim',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'suoim',
            'MixinConfigs'            : 'dayz-hotbar.client.mixins.json'
        ])
    }
}

// MixinGradle writes the generated Searge refmap to build/tmp and only injects it
// into the packaged jar. Dev runs load this mod from the compiled resources and
// classes directories instead, and the common project - which is built by Loom -
// contributes a refmap with the same name that targets intermediary. Forge cannot
// resolve intermediary targets, so Mixin would rewrite every target to class_XXXX
// names and fail with "specifies a target class which is not supported".
//
// Copy the Searge refmap into our own resources so this project's output, which
// Forge places first on the mod classpath, shadows the intermediary one during
// development exactly as it does in the packaged jar.
def forgeRefmap = layout.buildDirectory.file('tmp/compileJava/dayz-hotbar.refmap.json')

tasks.named('processResources', ProcessResources) {
    dependsOn tasks.named('compileJava')

    from(forgeRefmap)

    // Keep the declared mod version in step with gradle.properties rather than
    // letting a literal drift away from the version being built.
    inputs.property "version", project.version
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

base {
    archivesName = "dayz-hotbar-forge-${project.minecraft_version}"
}

// --- Ship the REOBFUSCATED jar -------------------------------------------
// Forge resolves members against SRG at runtime, but the `jar` task packages
// against official (Mojang) names. The jar has to be reobfuscated before it can
// load at all. ForgeGradle replaces the `jar` task's output in place and also
// writes a copy to build/reobfJar/output.jar; this copies that reobfuscated jar
// into build/libs under the release name.
//
// Reading ForgeGradle's own declared output, rather than whatever path the `jar`
// task happens to sit at, keeps the two concerns separate and makes this task the
// only writer of build/libs - `jar` writes to build/devlibs instead, so they no
// longer contend for one output file and Gradle's up-to-date checks stay coherent.
//
// This split exists because publishing used to read `jar.archiveFile`, which
// depends only on `jar` - and `publishMods` never runs `assemble`, so the fix-up
// never ran and the upload shipped the development jar. That is how a broken
// Forge release reached Modrinth and CurseForge while the GitHub release, built
// by `./gradlew build`, was fine. Development runs never caught it either,
// because `runClient` loads classes from the build output directories, which are
// on official names.
def releaseJarDir = layout.buildDirectory.dir('libs')
def releaseJarName = "${base.archivesName.get()}-${project.version}.jar"

def reobfuscatedJar = tasks.register('reobfuscatedJar', Copy) {
    // reobfJar is created lazily by ForgeGradle, so it can only be named from
    // inside a deferred block like this one.
    dependsOn tasks.named('reobfJar')

    from(layout.buildDirectory.file('reobfJar/output.jar'))
    into(releaseJarDir)
    rename { releaseJarName }
}

tasks.named('assemble') {
    dependsOn reobfuscatedJar
}

publishMods {
    // Must be the reobfuscated jar, and must be read off the task that writes it:
    // that is what makes publishMods depend on it. Resolving a plain path instead
    // would let `:forge:publishMods` upload a stale file, or the un-reobfuscated
    // development jar.
    file = reobfuscatedJar.map { releaseJarDir.get().file(releaseJarName) }
    changelog = rootProject.file("CHANGELOG.md").text
    type = STABLE

    modrinth {
        displayName = releaseName
        projectId = project.modrinth_id
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        modLoaders.add("forge")
        // Deliberately no requires("fabric-api") and none for Forge either: the
        // HUD mixes into vanilla's own Gui class and needs no loader API at all.
    }

    curseforge {
        displayName = releaseName
        projectId = project.curseforge_id
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        modLoaders.add("forge")
        // Client-only: there is no server-side component, and marking it
        // server-compatible would invite people to install it on a server that can
        // do nothing with it.
        client = true
        server = false
    }
}
