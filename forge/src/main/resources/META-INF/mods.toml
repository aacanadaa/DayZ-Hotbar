modLoader="javafml"
loaderVersion="[52,)"
license="Apache-2.0"
issueTrackerURL="https://github.com/aacanadaa/DayZ-Hotbar/issues"

[[mods]]
modId="dayz_hotbar"
version="${version}"
displayName="DayZ Hotbar"
authors="suoim"
description="Replaces the Minecraft HUD with a DayZ-style hotbar and a DayZ-style status readout."
displayURL="https://modrinth.com/mod/dayz-hotbar"
logoFile="assets/dayz_hotbar/icon.png"
# Client-only mod. Without this, a server running the mod would be flagged as
# having a mismatched version with every client that does not - which is every
# client, since there is nothing here for a server to install.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.dayz_hotbar]]
modId="forge"
mandatory=true
# 52.1.2, not 52.1.0. Forge 1.21.1 shipped with no HUD API at all - no ForgeGui, no
# RenderGuiOverlayEvent, and no ForgeLayeredDraw either - and the layered HUD hook this
# mod is built on (AddGuiOverlayLayersEvent) did not appear until 52.1.2. Declaring
# "[52,)" let Forge load the mod on 52.1.0 and then crash it with a raw
# NoClassDefFoundError during event-subscriber registration; this range turns that into
# a clean "requires Forge 52.1.2 or newer" instead.
versionRange="[52.1.2,)"
ordering="NONE"
side="CLIENT"

[[dependencies.dayz_hotbar]]
modId="minecraft"
mandatory=true
versionRange="[1.21.1,1.21.2)"
ordering="NONE"
side="CLIENT"
