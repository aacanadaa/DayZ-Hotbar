modLoader="javafml"
loaderVersion="${forge_loader_range}"
license="${mod_license}"
issueTrackerURL="${mod_issues}"

[[mods]]
modId="${mod_id}"
# Expanded from gradle.properties by processResources. Keep it a placeholder:
# a hardcoded value drifted once and shipped a jar that reported the wrong
# version in crash reports.
version="${version}"
displayName="${mod_name}"
authors="${mod_author}"
description="${mod_description}"
displayURL="https://modrinth.com/mod/${mod_id_slug}"
logoFile="assets/dayz_hotbar/icon.png"
# Client-only mod. Without this, a server running the mod would be flagged as
# having a mismatched version with every client that does not - which is every
# client, since there is nothing here for a server to install.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
# The floor is the exact version this node was compiled against, which lives in
# versions/<mc>/gradle.properties. Building against the oldest supported version
# is what makes javac enforce the declared range instead of trusting it.
versionRange="${forge_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_range}"
ordering="NONE"
side="CLIENT"
