plugins {
    id 'fabric-loom' version "${loom_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    // Fabric Loader only. This mod draws through Mixin on vanilla's own Gui, so
    // it needs no Fabric API and does not declare one as a dependency.
    modCompileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
}
loom {
    mixin {
        // The mixin config in common/src/main/resources declares
        // "refmap": "dayz-hotbar.refmap.json". Loom defaults to naming the
        // generated refmap after the project directory ("common-refmap.json"),
        // which does not match, so the mixins would fail to remap at runtime.
        // Forcing the name here keeps Fabric in sync with the declared refmap.
        defaultRefmapName = "dayz-hotbar.refmap.json"
    }
}

configurations {
    runtimeClasspath {
        exclude group: 'net.fabricmc', module: 'sponge-mixin'
    }
    runtimeElements {
        exclude group: 'net.fabricmc', module: 'sponge-mixin'
    }
}
