plugins {
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

version = project.mod_version
group = project.maven_group

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    version = rootProject.version
    group = rootProject.group

    repositories {
        mavenCentral()
        maven {
            name = 'Sponge / Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        // Minecraft 1.21.1 is a Java 21 target - the class file version moved up from
        // 17 in 1.20.5, and a jar built against 17 will not load.
        it.options.release = 21
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    jar {
        def projectName = project.name
        inputs.property "projectName", projectName
        // Ship the project's LICENSE inside every artifact, so the terms travel
        // with the copy rather than only living in the repository.
        from(rootProject.file("LICENSE")) {
            into 'META-INF'
            rename { "LICENSE-${projectName}" }
        }
    }
}
