# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Version properties
minecraft_version=1.20.1
loader_version=0.19.3
loom_version=1.6.12
# Forge 47.x is the 1.20.1 line - the same one the sibling DayZ Inventory build uses.
forge_version=47.2.0

# Mod Properties
mod_version=1.0.0
maven_group=com.suoim.dayzhotbar
mod_license=Apache-2.0
mod_authors=suoim
mod_description=Replaces the Minecraft HUD with a DayZ-style hotbar and a DayZ-style status readout for health, food, armor, absorption and experience.

# Repository links
github_repo=https://github.com/aacanadaa/DayZ-Hotbar
# modrinth_project is the slug a human reads; modrinth_id is what the publish block
# uses, because a slug can be renamed and an id cannot.
modrinth_project=dayz-hotbar
modrinth_id=hsTmy4Hi

# CurseForge project id.
curseforge_id=1693963

# Dependencies
fabric_api_version=0.92.9+1.20.1

# Java toolchain: this project targets Java 17 (Minecraft 1.20.1).
# Do NOT hardcode org.gradle.java.home here - it is machine-specific and breaks
# CI and other developers' builds. Set JAVA_HOME to a JDK 17+ instead.
# Gradle 8.8 supports JDK 17 through 22.
