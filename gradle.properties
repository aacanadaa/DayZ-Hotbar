# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Version properties
minecraft_version=1.21.1
loader_version=0.16.14
loom_version=1.7.4
# Forge 52.x is the 1.21.1 line.
#
# This is deliberately the OLDEST version the mod supports, not the newest, and it must
# stay in step with the "forge" versionRange in forge/src/main/resources/META-INF/mods.toml.
# Compiling against the newest build is what let a NoClassDefFoundError ship: the code was
# built against 52.1.16, where AddGuiOverlayLayersEvent exists, while the declared range
# "[52,)" also admitted 52.1.0, where it does not - so the jar compiled, built and passed
# every jar check, then crashed on load for anyone on an early 52.1.x. Compiling against
# the minimum makes javac enforce the range instead of trusting it.
forge_version=52.1.2
# NeoForge 21.1.x is the 1.21.1 line. NeoForge forked from Forge at 1.20.2, so the
# two loaders for one Minecraft version carry unrelated version numbers.
neoforge_version=21.1.250

# Mod Properties
mod_version=1.1.0
maven_group=com.suoim.dayzhotbar
mod_license=Apache-2.0
mod_authors=suoim
mod_description=Replaces the Minecraft HUD with a DayZ-style hotbar and a DayZ-style status readout for health, food, armor, absorption and experience.

# Repository links
github_repo=https://github.com/aacanadaa/DayZ-Hotbar
# modrinth_project is the slug a human reads; modrinth_id is what the publish block
# uses, because a slug can be renamed and an id cannot.
modrinth_project=dayz-hotbar
modrinth_id=hsTmy4Hi

# CurseForge project id.
curseforge_id=1693963

# Dependencies
fabric_api_version=0.116.6+1.21.1

# Java toolchain: Minecraft 1.21.1 requires Java 21 (the class file version moved up
# from 17 in 1.20.5/1.21). Do NOT hardcode org.gradle.java.home here - it is
# machine-specific and breaks CI and other developers' builds. Set JAVA_HOME to a
# JDK 21 instead.

# Checked against the real artifacts on 2026-09-15:
#   fabric-loom 1.7.4, fabric-loader 0.16.14, forge 1.21.1-52.1.16,
#   neoforge 21.1.250, ModDevGradle 2.0.x
