plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'me.modmuss50.mod-publish-plugin'
}

// Both the Minecraft version and the loader belong in the release name. CurseForge
// rejects a second file whose display name matches an existing one in the same
// project, and the same mod version gets released for more than one Minecraft
// version - so "DayZ Hotbar 1.0.0" alone would collide. A reader on either store
// also sees this name on the version list, where the loader is the first thing they
// need to check.
def releaseName = "DayZ Hotbar ${project.version} for Minecraft ${project.minecraft_version} (Fabric)"

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation project(":common")
}

loom {
    runs {
        client {
            client()
            runDir "run"
        }
        server {
            server()
            runDir "run"
        }
    }
}

base {
    archivesName = "dayz-hotbar-fabric-${project.minecraft_version}"
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    from project(":common").sourceSets.main.resources

    // The refmap is generated by the common (Loom) project. Keep a stale copy
    // from shadowing the correctly named one if both ever exist.
    exclude 'common-refmap.json'
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(":common").sourceSets.main.output
    exclude 'common-refmap.json'
}

publishMods {
    file = remapJar.archiveFile
    changelog = rootProject.file("CHANGELOG.md").text
    type = STABLE

    modrinth {
        displayName = releaseName
        projectId = project.modrinth_id
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        // Read from gradle.properties, never written as a literal. A hardcoded
        // version here publishes a jar labelled as the wrong Minecraft version -
        // and only the metadata is wrong, so testing the jar cannot catch it.
        minecraftVersions.add(project.minecraft_version)
        modLoaders.add("fabric")
        // Deliberately no requires("fabric-api"): this mod does not depend on it,
        // and declaring it would tell users to install something they do not need.
    }

    curseforge {
        displayName = releaseName
        projectId = project.curseforge_id
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        modLoaders.add("fabric")
        // Client-only: there is no server-side component, and marking it
        // server-compatible would invite people to install it on a server that can
        // do nothing with it.
        client = true
        server = false
    }
}
