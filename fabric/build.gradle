plugins {
    id 'fabric-loom' version "${loom_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation project(":common")
}

loom {
    runs {
        client {
            client()
            runDir "run"
        }
        server {
            server()
            runDir "run"
        }
    }
}

base {
    archivesName = "dayz-hotbar-fabric-${project.minecraft_version}"
}

tasks.named('processResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    from project(":common").sourceSets.main.resources

    // The refmap is generated by the common (Loom) project. Keep a stale copy
    // from shadowing the correctly named one if both ever exist.
    exclude 'common-refmap.json'
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from project(":common").sourceSets.main.output
    exclude 'common-refmap.json'
}
