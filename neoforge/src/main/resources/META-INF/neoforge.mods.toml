modLoader="javafml"
# NeoForge's FML is version 4.x on the 1.20.6+ lines, not the 1.x Forge uses.
loaderVersion="[4,)"
license="${mod_license}"
issueTrackerURL="${mod_issues}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_author}"
description="${mod_description}"
displayURL="https://modrinth.com/mod/${mod_id_slug}"
logoFile="assets/dayz_hotbar/icon.png"
# Client-only mod. Without this, a server running the mod would be flagged as
# having a mismatched version with every client that does not - which is every
# client, since there is nothing here for a server to install.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neoforge_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_range}"
ordering="NONE"
side="CLIENT"

# No `[[mixins]]` block: this module reaches the HUD through NeoForge's own layer
# renderer, and the shared Fabric mixin is excluded from this project's sources
# and jar. Declaring a config here would load a mixin that draws the HUD twice.
