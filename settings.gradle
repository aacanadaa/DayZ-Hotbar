pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
}

rootProject.name = 'dayz-hotbar'

include 'common'
include 'fabric'

// The forge/ module is deliberately NOT included.
//
// It builds and packages correctly, and its mixin is confirmed to apply:
// GuiMixin's handlers merge into net.minecraft.client.gui.Gui. But at runtime
// the DayZ hotbar draws while the status readout does not, and vanilla's
// health and food bars are never cancelled - so verdicts differ between the
// two injections inside one mixin, which is not a packaging fault and was not
// tracked down. See CLAUDE.md.
//
// include 'forge'
